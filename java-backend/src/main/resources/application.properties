spring.application.name=qinghe-campus-forum
server.address=127.0.0.1
server.port=${FORUM_PORT:8080}
server.servlet.session.cookie.name=QINGHE_JAVA_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.url=jdbc:mysql://127.0.0.1:${FORUM_DB_PORT:3306}/${FORUM_DATABASE:qinghe_forum_java}?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC
spring.datasource.username=${FORUM_DB_USER:qinghe_java_app}
spring.datasource.password=${FORUM_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
spring.flyway.clean-disabled=true
spring.thymeleaf.cache=true
spring.servlet.multipart.enabled=false
server.tomcat.max-http-form-post-size=1MB
