<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{parts :: head}"></head><body><header th:replace="~{parts :: header}"></header><main class="container"><div th:replace="~{parts :: message}"></div><section class="profile-card"><div class="avatar avatar-large" th:text="${#strings.substring(profile.display_name,0,1)}"></div><div><h1 th:text="${profile.display_name}"></h1><p th:text="${profile.bio==''?'还没有填写简介，先从一篇帖子认识TA。':profile.bio}"></p><small class="muted" th:text="|加入于 ${profile.created_at}|"></small></div><a th:if="${signedIn and viewer.id==profile.id}" class="button button-outline" href="/settings/profile/">编辑资料</a></section><div class="profile-feed"><h2>发布的帖子</h2><div th:replace="~{parts :: posts}"></div><nav th:replace="~{parts :: pagination}"></nav></div></main><footer th:replace="~{parts :: footer}"></footer></body></html>
