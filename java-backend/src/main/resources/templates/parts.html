<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><body>
<header class="site-header" th:fragment="header"><div class="header-inner"><a class="brand" href="/"><span class="brand-mark">青</span><span>青禾校园<small>校园里的每一种声音</small></span></a><nav aria-label="主导航"><a href="/">发现校园</a><a href="/?sort=hot">热门讨论</a></nav><div class="account-nav"><th:block th:if="${signedIn == true}"><a class="user-link" th:href="@{/users/{id}/(id=${viewer.id})}" th:text="${viewer.display_name}"></a><form method="post" th:action="@{/logout/}"><button class="text-button">退出</button></form></th:block><th:block th:unless="${signedIn == true}"><a href="/login/">登录</a><a class="button button-small" href="/register/">加入校园</a></th:block></div></div></header>
<head th:fragment="head"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>青禾校园 · 让校园里的想法相遇</title><link rel="stylesheet" href="/static/forum.css"><script src="/static/forum.js" defer></script></head>
<div th:fragment="message" class="messages" th:if="${message != null}" aria-live="polite"><div class="message success" th:text="${message}"></div></div>
<footer th:fragment="footer" class="site-footer"><div class="container footer-inner"><span>青禾校园 / 交流，让校园更近一点。</span><span>友善表达 · 尊重原创 · 保护隐私</span></div></footer>
<div th:fragment="posts" class="post-list"><article class="post-card" th:each="p:${posts}" th:attr="data-post-id=${p.id}"><div class="post-top"><a class="avatar" th:href="@{/users/{id}/(id=${p.author_id})}" th:text="${#strings.substring(p.display_name,0,1)}"></a><div class="post-author"><a th:href="@{/users/{id}/(id=${p.author_id})}" th:text="${p.display_name}"></a><time th:text="${p.created_at}"></time></div><a class="category-label" th:href="@{/(category=${p.category_slug})}" th:text="${p.category_name}"></a></div><h3><a th:href="@{/posts/{id}/(id=${p.id})}" th:text="${p.title}"></a></h3><p class="post-excerpt" th:text="${#strings.abbreviate(p.body,110)}"></p><div class="post-meta"><span th:text="|♡ ${p.like_count} 点赞|"></span><span th:text="|○ ${p.comment_count} 评论|"></span><a th:href="@{/posts/{id}/(id=${p.id})}">参与讨论 →</a></div></article><div class="empty-state" th:if="${#lists.isEmpty(posts)}"><h3 th:text="${q != '' ? '暂时没有找到相关帖子' : '这里还没有帖子'}"></h3><p>试试其他关键词，或分享你的校园故事。</p><a href="/posts/new/" class="button">发布帖子</a></div></div>
<nav th:fragment="pagination" class="pagination" aria-label="分页" th:if="${pages>1}"><a th:if="${page>1}" th:href="@{''(page=${page-1},q=${q},category=${category},sort=${sort})}">上一页</a><span th:text="|第 ${page} / ${pages} 页|"></span><a th:if="${page<pages}" th:href="@{''(page=${page+1},q=${q},category=${category},sort=${sort})}">下一页</a></nav>
</body></html>
