<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{parts :: head}"></head><body><header th:replace="~{parts :: header}"></header><main class="container"><section class="form-card delete-card"><h1>确定删除这篇帖子？</h1><p th:text="${post.title}"></p><p>帖子及其全部评论、点赞将被删除，此操作无法撤销。</p><form method="post" th:action="@{/posts/{id}/delete/(id=${post.id})}"><button class="button button-danger">确认删除帖子</button><a class="button button-outline" th:href="@{/posts/{id}/(id=${post.id})}">保留帖子</a></form></section></main><footer th:replace="~{parts :: footer}"></footer></body></html>
