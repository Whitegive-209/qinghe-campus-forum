<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{parts :: head}"></head><body><header th:replace="~{parts :: header}"></header><main class="container"><div class="form-shell"><section class="form-card"><p class="eyebrow">加入青禾校园</p><h1>从一次友善的交流开始。</h1><form method="post" th:action="@{/register/}" class="stacked-form"><p><label for="username">用户名</label><input name="username" id="username" required maxlength="30" autocomplete="username"></p><p><label for="nickname">昵称</label><input name="nickname" id="nickname" maxlength="30"></p><p><label for="password1">密码</label><input name="password1" id="password1" type="password" required minlength="8" autocomplete="new-password"><span class="helptext">至少8个字符，请勿使用常见或纯数字密码。</span></p><p><label for="password2">再次输入密码</label><input name="password2" id="password2" type="password" required minlength="8" autocomplete="new-password"></p><button class="button">创建账号</button></form></section></div></main><footer th:replace="~{parts :: footer}"></footer></body></html>
