<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{parts :: head}"></head><body><header th:replace="~{parts :: header}"></header><main class="container"><div th:replace="~{parts :: message}"></div><div class="breadcrumb"><a href="/">发现校园</a><span>/</span><span th:text="${post.category_name}"></span></div><div class="detail-layout"><div><article class="detail-card"><span class="category-label" th:text="${post.category_name}"></span><h1 th:text="${post.title}"></h1><div class="detail-author"><a th:href="@{/users/{id}/(id=${post.author_id})}" th:text="${post.display_name}"></a><time class="muted" th:text="${post.created_at}"></time></div><div class="post-body" style="white-space:pre-wrap" th:text="${post.body}"></div><div class="detail-actions"><form th:if="${signedIn}" method="post" th:action="@{/posts/{id}/like/(id=${post.id})}"><input name="action" type="hidden" th:value="${liked?'unlike':'like'}"><button class="button button-outline" th:text="|${liked?'取消点赞':'点赞'} · ${post.like_count}|"></button></form><a th:unless="${signedIn}" href="/login/" class="button button-outline" th:text="|登录后点赞 · ${post.like_count}|"></a><span class="muted" th:text="|${post.comment_count} 条评论|"></span><div class="owner-actions" th:if="${signedIn and viewer.id==post.author_id}"><a th:href="@{/posts/{id}/edit/(id=${post.id})}">编辑</a><a class="danger-link" th:href="@{/posts/{id}/delete/(id=${post.id})}">删除</a></div></div></article>
<section id="comments" class="comments-card"><h2>一起聊聊 <span class="muted" th:text="${post.comment_count}"></span></h2><form th:if="${signedIn}" method="post" th:action="@{/posts/{id}/comments/(id=${post.id})}" class="comment-form"><input name="parent" id="reply-parent" type="hidden"><div id="reply-indicator" hidden>正在回复 <span id="reply-name"></span> <button id="cancel-reply" type="button" class="text-button">取消回复</button></div><p><label for="id_body">评论</label><textarea id="id_body" name="body" required maxlength="1000" rows="3" placeholder="分享你的想法，友善交流。"></textarea></p><button class="button">发布评论</button></form><p class="login-prompt" th:unless="${signedIn}"><a href="/login/">登录</a> 后分享你的想法，一起参与讨论。</p><div class="comment-list"><article th:each="c:${comments}" class="comment" th:classappend="${c.parent_id!=null?'replies':''}" th:id="|comment-${c.id}|" th:attr="data-comment-id=${c.id}"><div class="comment-heading"><a th:href="@{/users/{id}/(id=${c.author_id})}" th:text="${c.display_name}"></a><time th:text="${c.created_at}"></time></div><p th:if="${c.is_deleted}" class="muted">评论已删除</p><p th:unless="${c.is_deleted}"><span class="reply-target" th:if="${c.parent_id!=null}" th:text="|回复 ${c.parent_name}：|"></span><span style="white-space:pre-wrap" th:text="${c.body}"></span></p><div class="comment-actions"><button th:if="${signedIn}" class="text-button reply-button" type="button" th:attr="data-parent=${c.id},data-author=${c.display_name}">回复</button><form th:if="${signedIn and viewer.id==c.author_id and !c.is_deleted}" method="post" th:action="@{/comments/{id}/delete/(id=${c.id})}" data-confirm="确定删除这条评论吗？已有回复会保留。"><button class="text-button danger-link">删除评论</button></form></div></article><p class="empty-comment" th:if="${#lists.isEmpty(comments)}">还没有评论，来留下第一条友善的回应吧。</p></div></section></div><aside class="sidebar"><section class="side-card"><h3>关于作者</h3><a th:href="@{/users/{id}/(id=${post.author_id})}" th:text="${post.display_name}"></a><p th:text="${post.bio==''?'校园里的一位分享者。':post.bio}"></p></section><section class="side-card"><h3>让讨论有温度</h3><p>就事论事，尊重彼此。发布前记得检查是否包含个人隐私。</p></section></aside></div></main><footer th:replace="~{parts :: footer}"></footer></body></html>
