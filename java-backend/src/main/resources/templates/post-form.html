<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{parts :: head}"></head><body><header th:replace="~{parts :: header}"></header><main class="container"><div class="form-shell"><section class="form-card"><h1 th:text="${editing?'编辑帖子':'分享校园新鲜事'}"></h1><form method="post" th:action="${editing ? '/posts/'+post.id+'/edit/' : '/posts/new/'}" class="stacked-form"><p><label for="category">分类</label><select id="category" name="category" required><option th:each="c:${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${editing and post.category_id==c.id}"></option></select></p><p><label for="title">标题</label><input id="title" name="title" required maxlength="100" th:value="${editing?post.title:''}"></p><p><label for="id_body">正文</label><textarea id="id_body" name="body" rows="12" required maxlength="10000" th:text="${editing?post.body:''}"></textarea></p><button class="button" th:text="${editing?'保存修改':'发布帖子'}"></button></form></section></div></main><footer th:replace="~{parts :: footer}"></footer></body></html>
