<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{parts :: head}"></head><body><header th:replace="~{parts :: header}"></header><main class="container"><div class="form-shell auth-shell"><a class="back-link" href="/">← 返回校园动态</a><section class="form-card"><p class="eyebrow">欢迎回来</p><h1>继续你的校园故事。</h1><p class="muted">登录后发帖、回复，也为好内容点个赞。</p><p class="message error" th:if="${param.error}">用户名或密码不正确，请重新输入。</p><form method="post" th:action="@{/login/}" class="stacked-form"><p><label for="username">用户名</label><input id="username" name="username" required maxlength="30" autocomplete="username"></p><p><label for="password">密码</label><input id="password" name="password" type="password" required autocomplete="current-password"></p><button class="button">登录</button></form><p class="auth-switch">还没有账号？<a href="/register/">创建账号</a></p></section></div></main><footer th:replace="~{parts :: footer}"></footer></body></html>
